# Render blueprint for the Rewind API + Postgres control plane (free tier).
#
# Deploy: push to GitHub, then on render.com "New +" -> "Blueprint" -> pick this
# repo. Render provisions the Postgres DB and the Docker web service, wires
# DATABASE_URL, runs migrations + seeds a demo backfill on boot, and gives you a
# public API URL. Put that URL in the frontend's NEXT_PUBLIC_REWIND_API on Vercel.
#
# Note: the free web-service tier sleeps after ~15 min idle and cold-starts in
# ~30-60s. The frontend's demo-mode fallback covers that window gracefully.
services:
  - type: web
    name: rewind-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rewind-db
          property: connectionString
      - key: DATA_ROOT
        value: /app/data
      - key: RUN_MIGRATIONS_ON_START
        value: "1"
      - key: SEED_ON_START
        value: "1"
      # Allow the Vercel frontend to call this API. Once you know your Vercel
      # URL, set this to it (e.g. https://rewind.vercel.app) to lock CORS down.
      # "*" is fine for an open public demo. (Comma-separate multiple origins.)
      - key: CORS_ORIGINS
        value: "*"
      # Protects the mutating endpoints (create / run / publish). Reads + /plan
      # stay open. Generate a random value in the Render dashboard (sync:false
      # means Render prompts you for it instead of committing it to the repo).
      - key: REWIND_API_KEY
        sync: false

databases:
  - name: rewind-db
    plan: free
    postgresMajorVersion: "16"
